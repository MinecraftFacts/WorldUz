
<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Minecraft World — V1.0</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 80 80'%3E%3Ccircle cx='40' cy='40' r='35' fill='%233b82a1'/%3E%3Cpath d='M8 34L25 20 41 26 51 14 70 27 57 44 62 59 39 73 24 55 11 52Z' fill='%23b6db65'/%3E%3C/svg%3E">
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script defer src="https://cdn.jsdelivr.net/npm/lucide@0.468.0/dist/umd/lucide.min.js"></script>
<style>
:root{
  --bg:#101925;
  --surface:#182837;
  --surface2:#213548;
  --text:#f6f4e8;
  --muted:#b0c0c8;
  --line:#3b5361;
  --accent:#e7bb61;
  --blue:#83bfdb;
  --mint:#a7e6a1;
  --red:#ff6879
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;min-height:100vh;color:var(--text);
  font:15px/1.55 system-ui,Arial,sans-serif;
  background:
    radial-gradient(ellipse at 90% 10%,#48709865,transparent 45%),
    radial-gradient(ellipse at 5% 60%,#bb843642,transparent 50%),
    linear-gradient(155deg,#131e2a,#172436 56%,#262635)
}
[hidden]{display:none!important}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.55;cursor:wait}
h1,h2,h3,p{margin:0 0 12px}
h1{font-size:clamp(29px,5vw,53px);line-height:1.1}
h2{font-size:23px}
h3{font-size:17px}
small,.muted{color:var(--muted)}
.icon{width:20px;height:20px;stroke-width:2}
.only-icon .icon{width:23px;height:23px}
a{color:var(--blue)}
header{
  position:sticky;top:0;z-index:20;display:flex;
  align-items:center;justify-content:space-between;gap:9px;
  background:#111d2be9;backdrop-filter:blur(18px);
  border-bottom:1px solid #728d9e65;
  padding:12px max(14px,calc((100vw - 1130px)/2))
}
.headside{display:flex;align-items:center;gap:8px}
.brand{
  border:0;background:none;color:inherit;display:flex;
  gap:9px;align-items:center;font-weight:900;
  font-size:clamp(16px,2.9vw,22px)
}
.brand .worldmark{
  display:grid;place-items:center;border-radius:12px;
  background:#244f60;width:38px;height:38px;color:var(--mint)
}
.brand .brown{color:#d69a5f}
.brand .green{color:#a3e9a8}
.v{
  font-size:11px;border:1px solid #a8b882;
  background:#2d4c3d;border-radius:7px;
  padding:2px 6px;color:#d5edb8
}
.btn,.iconbtn{
  border:1px solid transparent;border-radius:13px;
  padding:11px 16px;color:#162336;
  background:linear-gradient(115deg,#f1cd84,#9bdab0);
  font-weight:800;display:inline-flex;
  align-items:center;justify-content:center;
  gap:7px;transition:filter .15s
}
.btn:hover,.iconbtn:hover{filter:brightness(1.12)}
.btn.secondary,.iconbtn{
  background:#293e4d;color:var(--text);
  border-color:#547181
}
.btn.danger{
  background:#4c303c;color:#ffbfc3;border-color:#8d5060
}
.btn.small{padding:7px 11px;font-size:12px}
.iconbtn{
  width:41px;height:41px;padding:8px;position:relative
}
.count{
  position:absolute;right:-5px;top:-6px;
  background:var(--red);color:#111;border-radius:15px;
  padding:1px 5px;font-size:11px;min-width:18px
}
main{
  max-width:1130px;margin:auto;
  padding:23px 16px 110px
}
.page{display:none}
.page.active{display:block}
.hero{
  padding:clamp(24px,5vw,50px);
  border-radius:27px;border:1px solid #b3956a6e;
  background:
    linear-gradient(120deg,#314658dd,#384e65c9 45%,#816c418a),
    radial-gradient(circle at right,#c59b4080,transparent);
  box-shadow:0 18px 70px #0002;margin-bottom:26px
}
.hero b{color:#f6d28b}
.hero p{color:#d7e2e9;max-width:540px}
.tag{
  font-weight:800;font-size:11px;
  letter-spacing:2px;color:#efd79a
}
.row{display:flex;gap:11px;align-items:center}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.stack{display:grid;gap:15px}
.filters{
  display:flex;gap:9px;overflow:auto;
  padding-bottom:8px;margin-bottom:13px
}
.chip{
  border:1px solid #5a7181;border-radius:20px;
  background:#263c4c;color:#dce7ec;
  padding:8px 14px;white-space:nowrap
}
.chip.on{
  background:var(--accent);color:#1d2932;
  border-color:var(--accent)
}
.field{
  width:100%;color:var(--text);background:#101e2b;
  border:1px solid #536c7a;border-radius:12px;
  padding:12px 13px;outline:none
}
.field:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3px #e7bb6126
}
.search{max-width:440px;margin-bottom:17px}
.panel,.card{
  background:#182b3cdb;border:1px solid #4c6a7b;
  border-radius:19px;box-shadow:0 14px 32px #07121b44
}
.panel{padding:21px}
.formpanel{max-width:670px;margin:auto}
.grid{
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));
  gap:16px
}
.card{
  overflow:hidden;cursor:pointer;
  transition:transform .2s,border-color .2s
}
.card:hover{
  transform:translateY(-3px);border-color:#e7bb61
}
.modcover{
  width:100%;height:174px;display:block;
  background:#0d1824;object-fit:contain;padding:7px
}
.cardmain{padding:14px}
.cardmain h3{overflow-wrap:anywhere}
.stats{
  display:flex;align-items:center;gap:13px;
  color:var(--muted);flex-wrap:wrap;font-size:12px
}
.stats span{display:flex;gap:4px;align-items:center}
.stats .icon{width:15px;height:15px}
.avatar{
  height:70px;width:70px;flex-shrink:0;
  border-radius:50%;object-fit:cover;
  background:#386471;border:2px solid var(--accent)
}
.avatar.sm{width:46px;height:46px}
.userrow{display:flex;gap:12px;align-items:center;cursor:pointer}
.userrow h3{margin:0}
.userrow small{display:block}
.flexfill{flex:1;min-width:0}
.hint{
  min-height:17px;display:block;font-size:12px;
  color:var(--muted)
}
.hint.bad{color:#ff8792}
.hint.good{color:#a6f8b1}
label{display:grid;gap:6px;font-weight:650}
.drop{
  padding:23px;border:2px dashed #8a9c8b;
  background:#20384a;border-radius:16px;
  min-height:128px;display:grid;place-items:center;
  text-align:center;gap:8px;cursor:pointer
}
.drop:hover{border-color:var(--accent)}
.drop input{
  position:absolute;width:1px;height:1px;opacity:0
}
.previews{display:flex;gap:9px;flex-wrap:wrap}
.previews img{
  width:91px;height:73px;object-fit:contain;
  background:#142633;border-radius:9px
}
.drop .icon{
  width:31px;height:31px;color:var(--accent)
}
.bottom{
  position:fixed;bottom:0;left:50%;
  transform:translateX(-50%);
  background:#152636f2;border:1px solid #617786;
  border-bottom:0;backdrop-filter:blur(14px);
  display:grid;grid-template-columns:repeat(5,1fr);
  gap:5px;padding:10px;width:min(100%,520px);
  border-radius:22px 22px 0 0;z-index:30
}
.nav{
  border:0;border-radius:12px;background:transparent;
  color:#b7c9d4;height:52px;position:relative
}
.nav.active{background:#4b624c;color:#ffdc94}
.nav .icon{width:25px;height:25px}
.navdot{
  position:absolute;right:22%;top:7px;
  width:9px;height:9px;background:#ff7c7c;
  border-radius:50%
}
.modal{
  position:fixed;inset:0;z-index:50;
  background:#03070bcc;display:grid;
  place-items:center;padding:12px
}
.dialog{
  position:relative;width:min(100%,760px);
  max-height:90dvh;overflow-y:auto;
  background:linear-gradient(150deg,#1b3142,#172a38);
  border:1px solid #7093a1;border-radius:22px;padding:21px
}
.close{position:sticky;top:0;float:right;z-index:1}
.bigimage{
  height:clamp(210px,45vw,330px);width:100%;
  display:block;object-fit:contain;
  background:#0a1723;border-radius:16px
}
.thumbs{
  display:flex;gap:9px;margin:10px 0 16px;overflow:auto
}
.thumbs img{
  width:90px;height:68px;object-fit:contain;
  background:#102332;border-radius:9px;cursor:pointer
}
.actionicon{
  border:1px solid #516c79;border-radius:14px;
  background:#273b4c;color:#e4f0f6;padding:10px 15px;
  min-width:74px;display:grid;gap:5px;place-items:center
}
.actionicon .icon{width:24px;height:24px}
.actionicon.like.on{color:#ff6682}
.actionicon.like.on svg{fill:#ff6682}
.actionicon.save.on{color:#f7ffff}
.actionicon.save.on svg{fill:#f7ffff}
.actionicon small{font-size:11px}
.comment{
  padding:10px 0;border-bottom:1px solid #ffffff22;
  overflow-wrap:anywhere
}
.author{
  border:0;background:transparent;color:var(--blue);
  padding:0;font-weight:750;
  display:inline-flex;align-items:center;gap:8px
}
.author .avatar{height:34px;width:34px}
.chatlist{max-width:720px;margin:auto;min-height:320px}
.conversation{
  width:100%;display:flex;align-items:center;
  gap:12px;background:#253b4f;border:0;
  border-bottom:1px solid #456073;
  color:var(--text);padding:13px;text-align:left
}
.conversation:hover{background:#38566b}
.convoinfo{flex:1;min-width:0}
.convoinfo strong,.convoinfo small{
  display:block;overflow:hidden;white-space:nowrap;
  text-overflow:ellipsis
}
.unread{
  background:var(--accent);color:#172329;
  border-radius:30px;padding:2px 8px;
  font-size:12px;font-weight:900
}
.fab{
  position:absolute;bottom:17px;left:17px;
  height:44px;width:44px;border-radius:50%;
  border:0;background:var(--accent);color:#172537;
  display:grid;place-items:center
}
.chatarea{max-width:750px;margin:auto}
.messages{
  min-height:320px;max-height:56vh;overflow:auto;
  padding:17px;background:#0d1e2d;border-radius:14px;
  display:flex;flex-direction:column;gap:10px
}
.bubble{
  border-radius:13px;background:#31465a;max-width:83%;
  padding:10px 13px;align-self:start;
  overflow-wrap:anywhere;white-space:pre-wrap
}
.bubble.mine{background:#596443;align-self:end}
.bubble small{
  display:block;text-align:right;font-size:10px
}
.notice{
  background:#283e51;border:1px solid #587589;
  color:#fff;border-radius:11px;display:block;
  width:100%;padding:12px;margin:8px 0;text-align:left
}
.notice.new{
  border-color:#e3b96a;background:#4c4939
}
#toast{
  position:fixed;bottom:91px;left:50%;
  transform:translateX(-50%);
  z-index:99;background:#344d48;
  border:1px solid var(--accent);
  padding:12px 17px;max-width:92%;
  border-radius:12px;box-shadow:0 10px 30px #0008
}
.twocol{
  display:grid;grid-template-columns:1fr 1fr;gap:15px
}
.subhead{
  display:flex;justify-content:space-between;
  align-items:center;gap:9px;margin:21px 0 12px
}
.adminonly{border-color:#d6ae57}
.dangertext{color:var(--red)}
@media(max-width:740px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .modcover{height:126px}
  .cardmain{padding:10px}
  .cardmain h3{font-size:14px}
  .panel{padding:15px}
  .twocol{grid-template-columns:1fr}
  .hero{padding:26px 20px}
  .brand{font-size:15px}
  .v{font-size:10px}
}
@media(max-width:400px){
  main{padding:17px 12px 105px}
  .modcover{height:105px}
  .stats{gap:7px;font-size:10px}
  .headside{gap:3px}
  .brand{gap:5px}
}
</style>
</head>
<body>
<header>
  <div class="headside">
    <button id="settings-btn" class="iconbtn" aria-label="Settings">
      <i data-lucide="settings" class="icon"></i>
    </button>
    <button id="brand-btn" class="brand">
      <span class="worldmark">
        <i data-lucide="globe-2" class="icon"></i>
      </span>
      <span class="brown">Minecraft</span>
      <span class="green">World</span>
      <span class="v">V1.0</span>
    </button>
  </div>
  <button id="notif-btn" class="iconbtn" aria-label="Notifications">
    <i data-lucide="bell" class="icon"></i>
    <span id="notif-num" class="count" hidden>0</span>
  </button>
</header>
<main>
  <section id="home" class="page active">
    <div class="hero">
      <span class="tag" data-i="community"></span>
      <h1 data-i="hero"></h1>
      <p data-i="heroSub"></p>
    </div>
    <div class="subhead">
      <h2 data-i="mods"></h2>
      <span id="mod-num" class="muted"></span>
    </div>
    <input id="mod-search" class="field search" data-ph="searchMods">
    <div id="sort-list" class="filters"></div>
    <div id="category-list" class="filters"></div>
    <div id="mod-grid" class="grid"></div>
  </section>

  <section id="accounts" class="page">
    <div class="subhead">
      <h2 data-i="accounts"></h2>
      <span id="user-num" class="muted"></span>
    </div>
    <input id="people-search" class="field search" data-ph="searchUsers">
    <div id="people-grid" class="grid"></div>
  </section>

  <section id="upload" class="page">
    <h2 data-i="upload"></h2>
    <div id="upload-gate" class="panel" data-i="loginFirst"></div>
    <form id="mod-form" class="panel formpanel stack" hidden>
      <h3 id="mod-form-heading" data-i="newMod"></h3>
      <label>
        <span data-i="category"></span>
        <select id="mod-category" class="field" required></select>
      </label>
      <label>
        <span data-i="modName"></span>
        <input id="mod-name" class="field"
          required minlength="3" maxlength="70">
      </label>
      <label>
        <span data-i="description"></span>
        <textarea id="mod-desc" class="field"
          required minlength="10" maxlength="2500" rows="4"></textarea>
      </label>
      <label>
        <span data-i="images"></span>
        <span class="drop">
          <i data-lucide="images" class="icon"></i>
          <strong data-i="addImages"></strong>
          <small data-i="imagesHint"></small>
          <input id="mod-images" type="file"
            accept="image/jpeg,image/png,image/webp" multiple>
        </span>
      </label>
      <div class="previews" id="mod-image-preview"></div>
      <label>
        <span data-i="modFile"></span>
        <span class="drop">
          <i data-lucide="file-up" class="icon"></i>
          <strong data-i="addFile"></strong>
          <small data-i="fileHint"></small>
          <input id="mod-file" type="file"
            accept=".mcpack,.mcaddon,.zip,.jar">
        </span>
      </label>
      <small id="mod-file-selected"></small>
      <div class="row wrap">
        <button id="mod-save-btn" class="btn"
          type="submit" data-i="submitReview"></button>
        <button type="button" id="cancel-edit"
          class="btn secondary" hidden data-i="cancel"></button>
      </div>
    </form>
  </section>

  <section id="chats" class="page">
    <h2 data-i="chats"></h2>
    <div id="chat-gate" class="panel" data-i="loginFirst"></div>
    <div id="chat-wrap" hidden>
      <div class="panel chatlist" id="chat-list"
        style="position:relative;padding-bottom:75px;min-height:440px">
        <div class="subhead">
          <h3 data-i="conversations"></h3>
          <span id="conversation-num" class="muted"></span>
        </div>
        <div id="conversation-list"></div>
        <button id="new-chat" class="fab"
          title="Add contact" aria-label="Add contact">
          <i data-lucide="plus" class="icon"></i>
        </button>
      </div>
      <div id="chat-detail" class="panel chatarea" hidden>
        <div class="row">
          <button id="back-chat" class="iconbtn">
            <i data-lucide="arrow-left" class="icon"></i>
          </button>
          <img id="chat-avatar" class="avatar sm">
          <button id="chat-person" class="author">
            <strong id="chat-name"></strong>
          </button>
        </div>
        <div id="messages" class="messages" style="margin:15px 0"></div>
        <form id="message-form" class="row">
          <input id="message-text" class="field"
            required maxlength="500" data-ph="writeMessage">
          <button class="btn" aria-label="Send">
            <i data-lucide="send" class="icon"></i>
          </button>
        </form>
      </div>
    </div>
  </section>

  <section id="profile" class="page">
    <h2 data-i="profile"></h2>
    <div id="auth-box" class="panel formpanel">
      <h3 id="auth-head" data-i="login"></h3>
      <form id="auth-form" class="stack">
        <label>
          <span data-i="username"></span>
          <input id="auth-user" class="field"
            required minlength="3" maxlength="20" autocomplete="username">
          <small id="user-hint" class="hint"></small>
        </label>
        <label>
          <span data-i="password"></span>
          <input id="auth-pass" type="password"
            class="field" minlength="8" required
            autocomplete="current-password">
          <small id="pass-hint" class="hint"></small>
        </label>
        <label id="repeat-wrap" hidden>
          <span data-i="repeatPassword"></span>
          <input id="auth-repeat" type="password"
            class="field" minlength="8">
          <small id="repeat-hint" class="hint"></small>
        </label>
        <button id="auth-submit" class="btn"
          type="submit" data-i="login"></button>
      </form>
      <button id="auth-toggle" class="btn secondary"
        style="margin-top:14px;width:100%" data-i="register"></button>
      <small data-i="noRecovery"></small>
    </div>
    <div id="profile-box" hidden>
      <div class="panel row">
        <img id="profile-avatar" class="avatar">
        <div>
          <h2 id="profile-name" style="margin:0"></h2>
          <span id="profile-handle" class="muted"></span>
          <small id="my-role" style="display:block"></small>
        </div>
      </div>
      <form id="profile-form" class="panel stack"
        style="margin:15px 0;max-width:700px">
        <label>
          <span data-i="username"></span>
          <input id="profile-username" class="field"
            minlength="3" maxlength="20" required>
        </label>
        <label>
          <span data-i="nickname"></span>
          <input id="profile-nickname" class="field"
            maxlength="35" required>
        </label>
        <label>
          <span data-i="bio"></span>
          <textarea id="profile-bio" class="field"
            maxlength="240" rows="3"></textarea>
        </label>
        <label>
          <span data-i="avatar"></span>
          <span class="drop">
            <i data-lucide="image-plus" class="icon"></i>
            <strong data-i="changeAvatar"></strong>
            <input id="avatar-file" type="file"
              accept="image/jpeg,image/png,image/webp">
          </span>
        </label>
        <small id="avatar-selected"></small>
        <button class="btn" type="submit" data-i="save"></button>
      </form>
      <div class="panel" style="margin:14px 0">
        <h3 data-i="friendRequests"></h3>
        <div id="request-list"></div>
      </div>
      <div class="subhead"><h2 data-i="savedMods"></h2></div>
      <div class="grid" id="saved-grid"></div>
      <div class="subhead"><h2 data-i="myMods"></h2></div>
      <div class="grid" id="mine-grid"></div>
      <div id="admin-panel" class="panel adminonly"
        style="margin-top:20px" hidden>
        <h2 data-i="adminPanel"></h2>
        <h3 data-i="reviewQueue"></h3>
        <div id="review-list"></div>
      </div>
      <button id="logout" class="btn danger"
        style="margin-top:20px" data-i="logout"></button>
    </div>
  </section>
</main>
<nav class="bottom" aria-label="Navigation">
  <button class="nav active" data-page="home" aria-label="Home">
    <i data-lucide="house" class="icon"></i>
  </button>
  <button class="nav" data-page="accounts" aria-label="Accounts">
    <i data-lucide="users" class="icon"></i>
  </button>
  <button class="nav" data-page="upload" aria-label="Upload">
    <i data-lucide="plus-circle" class="icon"></i>
  </button>
  <button class="nav" data-page="chats" aria-label="Chats">
    <i data-lucide="message-circle" class="icon"></i>
    <span id="chat-dot" class="navdot" hidden></span>
  </button>
  <button class="nav" data-page="profile" aria-label="Profile">
    <i data-lucide="user-round" class="icon"></i>
  </button>
</nav>
<div id="modal" class="modal" hidden>
  <div class="dialog">
    <button id="modal-close" class="iconbtn close">
      <i data-lucide="x" class="icon"></i>
    </button>
    <div id="modal-body"></div>
  </div>
</div>
<div id="toast" hidden role="status" aria-live="polite"></div>
<script defer src="app-v1.js"></script>
</body>
</html>
